name: Release

on:
  push:
    tags: ['v*']

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      GOWORK: 'off'
    steps:
      - name: Require successful CI for this commit
        run: |
          ci_conclusion=$(gh run list --workflow ci.yml --branch main --event push \
            --commit "$GITHUB_SHA" --limit 1 --json conclusion --jq '.[0].conclusion')
          if [[ "$ci_conclusion" != success ]]; then
            echo 'CI must pass on main for this commit before releasing.' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Build archives
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: release --clean --skip=publish
      - name: Verify version and publish
        run: |
          test "$(dist/pkudisk_linux_amd64_v1/pkudisk version)" = "pkudisk $RELEASE_TAG"
          flags=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then flags=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" "${flags[@]}" \
            dist/*.tar.gz dist/*.zip dist/checksums.txt
          GOPROXY=https://proxy.golang.org go list -m "github.com/unofficialpku/disk@$RELEASE_TAG"
