import org.gradle.api.file.DirectoryProperty

plugins {
    id 'com.android.application'
}

def releaseKeystore = providers.environmentVariable('PKUDISK_ANDROID_KEYSTORE')

android {
    namespace 'su.zzi.pkudiskfuse'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'su.zzi.pkudiskfuse'
        minSdk 29
        targetSdk 36
        versionCode 5
        versionName '0.6.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures.buildConfig = true

    // Keys stay outside the checkout. Unsigned release builds remain available
    // for downstream packagers; publishing supplies these environment values.
    signingConfigs {
        if (releaseKeystore.isPresent()) {
            release {
                storeFile file(releaseKeystore.get())
                storePassword providers.environmentVariable('PKUDISK_ANDROID_STORE_PASSWORD').get()
                keyAlias providers.environmentVariable('PKUDISK_ANDROID_KEY_ALIAS').get()
                keyPassword providers.environmentVariable('PKUDISK_ANDROID_KEY_PASSWORD').get()
            }
        }
    }
    buildTypes {
        release {
            if (releaseKeystore.isPresent()) signingConfig signingConfigs.release
        }
    }

    sourceSets.main.res.srcDir layout.buildDirectory.dir('generated/brandRes')
}

dependencies {
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.webkit:webkit:1.17.1'
    implementation files(layout.buildDirectory.file('generated/mobilegui.aar')).builtBy('buildGo')
}

tasks.register('buildGo', Exec) {
    workingDir rootProject.projectDir
    commandLine 'sh', 'scripts/build-go.sh', android.sdkDirectory,
        android.ndkVersion, layout.buildDirectory.file('generated/mobilegui.aar').get().asFile,
        providers.gradleProperty('abis').getOrElse('arm64-v8a,x86_64')
}
tasks.register('copyBrandAssets', Copy) {
    from(rootProject.file('../../assets/brand/source.png')) { rename { 'icon.png' } }
    from(rootProject.file('../../internal/desktop/assets/template.png')) { rename { 'notification.png' } }
    into layout.buildDirectory.dir('generated/brandRes/drawable-nodpi')
}
tasks.named('preBuild').configure { dependsOn 'buildGo', 'copyBrandAssets' }

// Carry redistribution notices inside the one APK distributed to users.
apply from: rootProject.file('../scripts/licenses.gradle')
tasks.register('collectSourceLicenses', Exec) {
    workingDir rootProject.projectDir
    commandLine 'sh', '../scripts/licenses.sh', '--sources-only'
}
abstract class LicenseAssets extends Sync {
    @OutputDirectory abstract DirectoryProperty getOutputDirectory()
}
def licenseAssets = tasks.register('prepareReleaseLicenses', LicenseAssets) {
    dependsOn 'collectSourceLicenses', 'exportRuntimeLicenses'
    from(rootProject.file('../build/licenses')) { into 'licenses' }
    filePermissions { unix('0644') }
    dirPermissions { unix('0755') }
    outputDirectory.set(layout.buildDirectory.dir('generated/licenseAssets'))
    into outputDirectory
}
androidComponents.onVariants(androidComponents.selector().withBuildType('release')) { variant ->
    variant.sources.assets.addGeneratedSourceDirectory(licenseAssets) { it.outputDirectory }
}
