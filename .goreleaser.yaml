version: 2
project_name: pkudisk

before:
  hooks:
    - sh scripts/release-files.sh

builds:
  - id: pkudisk
    main: ./cmd/pkudisk
    binary: pkudisk
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - docs/platform-support.md
      - docs/transfer-limits.md
      - docs/gui.md
      - desktop/*
      - internal/gui/web/THIRD_PARTY_LICENSES.txt
      - internal/gui/web/NUXT_UI_STARTER_LICENSE.txt
      - internal/gui/web/LUCIDE_LICENSE.txt
      - completions/*
      - licenses/Go-LICENSE
      - licenses/**/*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Version }}-dev"
